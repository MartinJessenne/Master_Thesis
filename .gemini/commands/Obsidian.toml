description = "Generate a well-formatted note in the Obsidian Vault to document a solution, theory, or approach derived from the conversation."

prompt = """
Based on our previous conversation, please formalize the knowledge, solution, theory, or approach derived into a Zettelkasten note.

Follow these instructions strictly:
1. **Determine the Note Type & Location**: Decide whether the note belongs in `Obsidian_Vault/10_Inquiry`, `Obsidian_Vault/20_Logic_and_Method`, `Obsidian_Vault/40_Evidence`, etc.
2. **Apply the Right Template**: Check `Obsidian_Vault/99_System/Templates/` for the appropriate template (e.g., algorithm pseudocode, default, evidence, inquiry, trial).
3. **Draft the Content**: Write the content incorporating the solution, theory, or approach discussed. Ensure the explanation is highly contextualized, details the theory, and outlines the approach.
4. **Add Metadata**: Include relevant tags (e.g., `#thesis`, `#rust`, `#math`) and standard YAML frontmatter based on the template.
5. **Add Backlinks**: Connect the note to existing related notes using `[[Note Name]]` syntax.
6. **Save the File**: Create the `.md` file in the correct directory within `Obsidian_Vault`.
7. **Notify the User**: Output the path to the newly created markdown file in the chat.

Additional instructions from the user for this specific note:
{{args}}
"""